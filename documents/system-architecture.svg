<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <style>
    .box { fill:#f4f6f8; stroke:#334155; stroke-width:2 }
    .text { font-family: Arial, sans-serif; font-size:14px; fill:#0f172a }
    .title { font-weight:700; font-size:16px }
  </style>
  <rect x="40" y="40" width="920" height="520" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" />

  <!-- Client -->
  <rect class="box" x="70" y="80" width="160" height="60" rx="6" />
  <text class="text title" x="150" y="115" text-anchor="middle">Client</text>

  <!-- API Gateway -->
  <rect class="box" x="270" y="80" width="220" height="60" rx="6" />
  <text class="text title" x="380" y="115" text-anchor="middle">API Gateway (Ocelot)</text>

  <!-- Services -->
  <rect class="box" x="70" y="180" width="260" height="300" rx="6" />
  <text class="text" x="200" y="205" text-anchor="middle">Catalog</text>
  <text class="text" x="200" y="230" text-anchor="middle">Basket</text>
  <text class="text" x="200" y="255" text-anchor="middle">Discount (API + gRPC)</text>
  <text class="text" x="200" y="280" text-anchor="middle">Ordering</text>

  <rect class="box" x="370" y="180" width="260" height="140" rx="6" />
  <text class="text" x="500" y="205" text-anchor="middle">Event Bus</text>
  <text class="text" x="500" y="225" text-anchor="middle">(RabbitMQ)</text>

  <rect class="box" x="370" y="340" width="260" height="140" rx="6" />
  <text class="text" x="500" y="365" text-anchor="middle">Data Stores</text>
  <text class="text" x="500" y="385" text-anchor="middle">MongoDB, Redis, Postgres/SQL</text>

  <!-- Arrows -->
  <line x1="230" y1="110" x2="270" y2="110" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="350" y1="140" x2="350" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="320" x2="370" y2="320" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a" />
    </marker>
  </defs>

  <text class="text" x="70" y="520">Generated: system-architecture.svg — simple overview</text>
</svg>

